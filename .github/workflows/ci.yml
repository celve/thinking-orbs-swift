name: CI

on: [push, pull_request]

jobs:
  build-test-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - run: swift build
      - run: swift test --parallel
      - run: Scripts/smoke.sh
